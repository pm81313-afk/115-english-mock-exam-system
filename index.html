</select>

<option value="all">所有考點分類</option>
<option value="名詞辨析">名詞辨析</option>
<option value="動詞與片語">動詞與片語</option>
<option value="形容詞與副詞">形容詞與副詞</option>
<option value="句構與文法">句構與文法</option>
<option value="語意連貫與轉折">語意連貫與轉折</option>

<option value="細節與指代">細節與指代</option>

          </button>

</div>
</div>
</header>

<span class="font-bold text-xs uppercase tracking-wider text-slate-500">題號快速導覽 (1-50)</span>
<button class="text-slate-400 hover:text-slate-600 text-xs" onclick="toggleSidebar()">
<i class="fa-solid fa-angles-left"></i>
</button>
</div>
<!-- 圖例說明 -->

<div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span>答對</div>
<div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-rose-500 inline-block"></span>答錯</div>
<div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block"></span>已收藏/待複習</div>

<div class="p-3 overflow-y-auto custom-scroll flex-1 space-y-4" id="nav-grid-container"></div>
</aside>
<!-- 側邊欄收合時的展開小按鈕 -->
<button class="hidden fixed left-0 top-1/2 -translate-y-1/2 z-20 bg-indigo-600 text-white p-2 rounded-r-lg shadow-lg no-print" id="sidebar-open-btn" onclick="toggleSidebar()">
<i class="fa-solid fa-angles-right"></i>
</button>
<!-- 核心雙欄分割視窗 (Split View) -->
<main class="flex-1 flex flex-col lg:flex-row overflow-hidden split-container bg-slate-50">
<!-- 左欄：閱讀篇章 / 題組文章 / 語音朗讀與雙語對照 (可獨立滾動) -->
<section class="w-full lg:w-1/2 h-2/5 lg:h-full overflow-y-auto custom-scroll border-b lg:border-b-0 lg:border-r border-slate-200 bg-white p-4 sm:p-6 split-pane" id="left-passage-pane">
<div id="passage-container"></div>
</section>
<!-- 右欄：題目列表與深度詳解卡片 (可獨立滾動) -->

<!-- 提示橫幅 -->
<div class="bg-indigo-50 border border-indigo-200 rounded-xl p-3 flex items-center justify-between text-xs text-indigo-800 no-print">
<div class="flex items-center gap-2">
<i class="fa-solid fa-lightbulb text-indigo-600 text-base"></i>
<span><strong>互動小貼士：</strong>點擊文章或題目中的任何英文單字可開啟<strong>即時字典與發音</strong>；點擊詳解中的「定位至原文」可在左側文章高亮出處！</span>
</div>
</div>
<!-- 題目容器 -->
<div class="space-y-6 pb-16" id="questions-container"></div>
</section>
</main>
</div>
<!-- 點擊查單字浮動字典 (Interactive Dictionary Popover) -->
<div class="hidden fixed z-50 bg-slate-900 text-white rounded-xl shadow-2xl border border-slate-700 p-4 w-72 no-print transition-opacity" id="dict-popover">
<div class="flex items-start justify-between border-b border-slate-700 pb-2 mb-2">
<div>
<div class="flex items-center gap-2">
<h4 class="font-bold text-lg text-amber-400" id="dict-word">word</h4>
<span class="text-xs bg-slate-700 px-1.5 py-0.5 rounded text-slate-300" id="dict-pos">n.</span>
</div>

</div>
<div class="flex items-center gap-1">
<button class="w-7 h-7 rounded-full bg-indigo-600 hover:bg-indigo-500 flex items-center justify-center text-white" onclick="speakWord(document.getElementById('dict-word').innerText)" title="發音">

</button>

</div>

<div class="text-xs text-slate-400 bg-slate-800/80 p-2 rounded border border-slate-700/60" id="dict-extra"></div>

</div>
</div>
</div>

<div class="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
<div class="flex items-center gap-2">
<i class="fa-solid fa-chart-pie text-sky-400"></i>
<h3 class="font-bold text-lg">學習數據統計與各大題診斷儀表板</h3>
</div>
<button class="text-slate-400 hover:text-white" onclick="closeModal('analyticsModal')"><i class="fa-solid fa-xmark text-xl"></i></button>
</div>
<div class="p-6 overflow-y-auto custom-scroll flex-1" id="analytics-content">
<!-- 動態渲染 -->
</div>
</div>
</div>

<div class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 no-print" id="printModal">
<div class="bg-white rounded-2xl shadow-xl max-w-md w-full overflow-hidden">
<div class="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">

<div>
<div class="font-bold text-slate-800 group-hover:text-indigo-600">純試卷列印模式（隱藏詳解）</div>
<div class="text-xs text-slate-500 mt-1">適合重新紙本計時模擬作答、畫線練習</div>
</div>
<i class="fa-solid fa-file-lines text-2xl text-slate-400 group-hover:text-indigo-600"></i>
</button>
<button class="w-full p-4 rounded-xl border-2 border-slate-200 hover:border-indigo-600 text-left flex items-center justify-between transition group" onclick="executePrint('full')">
<div>
<div class="font-bold text-slate-800 group-hover:text-indigo-600">完整題目＋詳解講義模式</div>
<div class="text-xs text-slate-500 mt-1">展開所有中譯、誘答分析、長難句與單字卡供考前複習</div>
</div>
<i class="fa-solid fa-book text-2xl text-slate-400 group-hover:text-indigo-600"></i>
</button>
</div>
</div>

<script>
    // ==========================================
    // 1. 內建核心字典庫 (支援點擊查字與語音)
    // ==========================================
    const DICT_DB = {
      "parcel": { kk: "/ˈpɑrsḷ/", pos: "n.", def: "包裹", extra: "同義: package | 搭配: send/deliver a parcel" },
      "cargo": { kk: "/ˈkɑrɡo/", pos: "n.", def: "（船、飛機裝載的）貨物", extra: "搭配: cargo ship 貨輪" },
      "bundle": { kk: "/ˈbʌndḷ/", pos: "n.", def: "捆；束；包", extra: "搭配: a bundle of clothes 一捆衣服" },
      "slender": { kk: "/ˈslɛndɚ/", pos: "adj.", def: "苗條的；修長的；微薄的", extra: "同義: slim, lean | 反義: plump, chubby" },
      "eloquent": { kk: "/ˈɛləkwənt/", pos: "adj.", def: "雄辯的；口才流利的", extra: "搭配: an eloquent speaker" },

      "omit": { kk: "/oˈmɪt/", pos: "v.", def: "省略；刪去；遺漏", extra: "名詞: omission | 同義: leave out, exclude" },
      "neglect": { kk: "/nɪˈɡlɛkt/", pos: "v./n.", def: "疏忽；忽略；疏於照顧", extra: "同義: ignore, overlook" },
      "damp": { kk: "/dæmp/", pos: "adj.", def: "潮濕的；微濕的", extra: "同義: moist, humid | 反義: dry" },

      "practically": { kk: "/ˈpræktɪklɪ/", pos: "adv.", def: "幾乎；簡直；實際上", extra: "同義: virtually, almost, nearly" },
      "intuition": { kk: "/ˌɪntjuˈɪʃən/", pos: "n.", def: "直覺；直覺力", extra: "形容詞: intuitive | 搭配: feminine intuition" },
      "cease": { kk: "/sis/", pos: "v.", def: "停止；終止；結束", extra: "搭配: cease operations 停止營業 | 同義: halt, stop" },

      "frame": { kk: "/frem/", pos: "v.", def: "陷害；栽贓；給…鑲框", extra: "搭配: frame sb. for a crime 栽贓某人犯罪" },

        title: "第四大題：篇章結構（第 31–34 題題組）— Z 世代瘋迷絨毛玩偶（Labubu / Jellycat）背後的社會心理",
        type: "社會文化與世代觀察",
        bilingual: true,
        wordBank: "(A) Loneliness is an equally pressing issue for Gen Z.\n(B) Rather, this trend reflects an adaptive coping mechanism.\n(C) This explanation, however, only captures part of the picture.\n(D) As a result, many Gen Zers have abandoned traditional milestones like homeownership.\n(E) Gen Zers are defining traditional notions of success and social status on their own terms.",
        audioSentences: [
          { time: "00:00", en: "Walk into any Gen Zer's bedroom today and you might find shelves lined with collectibles — plushies like Labubu and Jellycat. Clearly, plush toys are no longer just for kids. This trend reflects something deeper about the generation driving it.", zh: "走進今天任何一位 Z 世代年輕人的臥室，你都可能會發現架上擺滿了收藏品——像 Labubu 和 Jellycat 這樣的毛絨玩具。顯然，毛絨玩具不再只是小孩子的專利。這股潮流反映出推動它的這個世代更深層的特質。" },
          { time: "00:18", en: "On the surface, this phenomenon is fueled by nostalgia. Plush toys offer a rare source of uncomplicated happiness in an overwhelming world. Psychologists interpret this as a form of the \"Peter Pan effect,\" where young adults cling to childhood artifacts to escape the responsibilities of maturity. (31) [C] This explanation, however, only captures part of the picture.", zh: "表面上，這個現象是由懷舊之情所驅動。在一個令人不知所措的世界裡，毛絨玩具提供了一個罕見且單純的快樂泉源。心理學家將其解釋為「彼得潘效應」的一種形式，意即年輕人依戀童年的物件以逃避長大成人所帶來的責任。(31) 然而，這種解釋只捕捉到了部分的事實。", evId: "ev-31" },
          { time: "00:42", en: "The economic realities facing Gen Z shed further light on this trend. Many feel they cannot afford the kind of adult life they had once imagined. Economic turmoil and skyrocketing costs of living have put immense pressure on them, while footage of war on social media deepens their sense of uncertainty and instability.", zh: "Z 世代面臨的經濟現實，為這股潮流提供了進一步的啟示。許多人覺得自己負擔不起曾經想像過的那種成年人生活。經濟動盪和飆升的生活成本給他們帶來了巨大的壓力，而社群媒體上戰爭的畫面更深化了他們的未知感與不穩定感。" },
          { time: "01:03", en: "(32) [D] As a result, many Gen Zers have abandoned traditional milestones like homeownership. Rather than saving for goals that now feel unattainable, they redirect their income toward small, manageable sources of happiness.", zh: "(32) 因此，許多 Z 世代年輕人已經放棄了像買房這類的傳統里程碑。相較於為了現在看來遙不可及的目標而儲蓄，他們轉而將收入投向微小、可控的快樂泉源。", evId: "ev-32" },
          { time: "01:18", en: "(33) [A] Loneliness is an equally pressing issue for Gen Z. For many, buying and collecting plush toys offers unexpected relief from it. By joining online collector communities and attending immersive pop-up events, they transform solitary objects into shared social currency and gain a sense of belonging that modern life often fails to provide.", zh: "(33) 孤獨感對 Z 世代來說是另一個同樣迫切的問題。對許多人而言，購買和收集毛絨玩具為此帶來了意想不到的慰藉。藉由加入線上收藏家社群並參加沉浸式的快閃活動，他們將孤立的物品轉化為共享的社交貨幣，並獲得了現代生活常常無法提供的歸屬感。", evId: "ev-33" },
          { time: "01:42", en: "The popularity of plushies among Gen Z is not a sign of immaturity. (34) [B] Rather, this trend reflects an adaptive coping mechanism. Faced with uncertainty and pressure, they are finding new ways to experience joy and connection. While these choices may seem childish at times, they reveal a deliberate effort to build meaning in an increasingly unpredictable world.", zh: "毛絨玩具在 Z 世代中的流行並不是不成熟的表現。(34) 相反地，這股潮流反映了一種適應性的應對機制。面對不確定性和壓力，他們正在尋找體驗快樂和連結的新方法。雖然這些選擇有時看起來很幼稚，但它們展現了一種在日益不可預測的世界中，努力建立出意義的刻意嘗試。", evId: "ev-34" }
        ],
        sentenceAnalysis: [

            qRef: "第 4 段長難句解構",

      "reading_35_38": {
        title: "第五大題：閱讀測驗（第 35–38 題題組）— 恐狼復活計畫與「保育漂綠」(Conservation-washing)",
        type: "生物科技與生態保育評論",
        bilingual: true,
        audioSentences: [
          { time: "00:00", en: "[Para 1] Their names are Romulus, Remus and Khaleesi, and they're the first dire wolves to walk the Earth in over 10,000 years — or at least that's what one biotech company would like you to believe.", zh: "【第1段】牠們的名字叫做 Romulus、Remus 和 Khaleesi，而牠們是超過一萬年來第一批再次行走在地球上的恐狼——或者至少，某家生物科技公司希望你這麼相信。" },
          { time: "00:15", en: "[Para 2] In 2024, Colossal Biosciences announced the births of three dire wolves, extinct since the last ice age. While the young wolves have sparked great hype on social media, what Colossal did is not genuine de-extinction, but a case of conservation-washing.", zh: "【第2段】2024 年，Colossal Biosciences 宣布三隻恐狼誕生。恐狼自上一個冰河時期結束後便已滅絕。雖然這些幼狼在社群媒體上引發極大轟動，但 Colossal 所做的並非真正的物種復活，而是一種保育漂綠行動。" },
          { time: "00:34", en: "Its scientists extracted dire wolf DNA from ancient fossilized remains. After careful analysis, they isolated a handful of genes by identifying key genetic markers. They then edited those into the genomes of modern grey wolves.", zh: "該公司的科學家從古老化石遺骸中萃取恐狼 DNA。經過仔細分析後，他們透過辨識關鍵基因標記，分離出少數幾個基因。接著，他們把那些（被分離出的基因）編輯進現代灰狼的基因組中。", evId: "ev-36" },
          { time: "00:50", en: "The modified cells were used to create embryos, which were implanted into surrogate dogs. The pups exhibit some traits of dire wolves: broader shoulders, larger bodies and pale coats.", zh: "經過修改的細胞被用來製造胚胎，再植入代孕犬體內。這些幼狼確實展現出一些恐狼特徵：較寬的肩膀、更大的體型以及淺色毛皮。", evId: "ev-38" },
          { time: "01:04", en: "Impressive as this technological feat is, these pups are, at best, hybrids. Colossal's claim that it has brought back a once-eradicated species for the first time in human history is misleading. It's simply a ploy of clever marketing and emotional appeal.", zh: "儘管這項科技成就令人印象深刻，但這些幼狼充其量只是混種生物。Colossal 聲稱自己首次在人類歷史上讓一個已滅絕的物種重返世界，這種說法具有誤導性。這不過是一種聰明的行銷手法與情感訴求而已。", evId: "ev-35" },
          { time: "01:22", en: "[Para 3] Before the dire wolf project, Colossal used a similar technique to engineer a \"wooly mouse\" — a rodent genetically modified to have mammoth-like pelts. As the leading company in the growing de-extinction movement in the US, it promises that its technologies will help restore ecological balance and bring back other extinct creatures.", zh: "【第3段】在恐狼計畫之前，Colossal 曾使用類似技術創造出一種「長毛鼠」——一種經基因改造、長出類似長毛象毛皮的老鼠。作為美國日益壯大的物種復活運動中的領導企業，該公司承諾其技術將有助於恢復生態平衡，並讓其他已滅絕生物重現世間。" },
          { time: "01:44", en: "Meanwhile, in Europe, a group of startups is applying technology in more grounded, practical ways. For instance, Stream Ocean from Switzerland has developed facial recognition software to monitor fish species, and Germany's Soilytix tracks soil health using environmental DNA. This is where technology can genuinely support biodiversity restoration — not through Frankensteinian genetic manipulations.", zh: "與此同時，在歐洲，一些新創公司正以更務實、更貼近現實的方式運用科技。例如，瑞士的 Stream Ocean 開發臉部辨識軟體來監測魚類物種；德國的 Soilytix 則利用環境 DNA 追蹤土壤健康狀況。這才是科技真正能夠支持生物多樣性復育的方式——而不是透過如同《科學怪人》般的人造基因操弄。", evId: "ev-37" },
          { time: "02:10", en: "[Para 4] Colossal has broadcast the message that extinction is reversible, but it's not. This may create a dangerous distraction from proven solutions to the biodiversity crisis. The Trump administration has already cited Colossal's claims as an excuse to reduce endangered species protections. While the public marvels at the adorable \"dire-ish\" wolves, biodiversity loss is snowballing. Instead of playing God with long-extinct creatures, humanity's true priority should be to safeguard existing biodiversity and restore what's been damaged.", zh: "【第4段】Colossal 傳遞出滅絕是可逆的這一訊息，但事實並非如此。這種說法可能使大眾忽略那些已被證明有效的生物多樣性危機解決方案。川普政府甚至已引用 Colossal 的主張作為削減瀕危物種保護措施的藉口。當大眾驚嘆於這些可愛的「類恐狼」時，生物多樣性的流失卻正不斷加劇。與其扮演上帝去操弄早已滅絕的生物，人類真正的首要任務應該是保護現存的生物多樣性，並修復已遭破壞的生態系統。" }
        ],
        sentenceAnalysis: [
          {
            qRef: "第 2 段讓步倒裝句解構",
            sentence: "[Impressive as this technological feat is], these pups are, at best, hybrids.",
            breakdown: "【讓步副詞子句倒裝】Impressive (形容詞補語移至句首) as (= though，雖然) this technological feat (主詞) is (動詞)，正常語序為 Although this technological feat is impressive ＋ 【主句】these pups are, at best (充其量), hybrids."
          }
        ]
      },
      "reading_39_42": {
        title: "第五大題：閱讀測驗（第 39–42 題題組）— 1602 年伊莉莎白一世致中國萬曆皇帝的信件奇航",
        type: "歷史與地理探索",
        bilingual: true,
        hasMap: "weymouth",
        audioSentences: [
          { time: "00:00", en: "[Para 1] In 1602, Queen Elizabeth I of England wrote a letter to the Emperor of China in the hope of opening up a trade route and starting friendly relations. She entrusted the letter to George Weymouth, who had been hired by the East India Company to seek a northwest passage to the Far East. This was part of England's broader effort to find an alternative trade route to the east, where the Portuguese and Dutch held a strong grip on trade. Weymouth carried the letter in English, accompanied by copies in Latin, Spanish and Italian.", zh: "【第1段】1602 年，英格蘭女王伊莉莎白一世寫了一封信給中國皇帝，希望開闢貿易路線、建立友好關係。她將信交託給喬治·韋茅斯（George Weymouth），此人受僱於東印度公司，負責尋找通往遠東的西北航道。這是英格蘭為尋找東方替代貿易路線所做的廣泛努力之一，當時葡萄牙與荷蘭已牢牢掌控著那片海域的貿易。韋茅斯攜帶的信件以英文書寫，並附有拉丁文、西班牙文與義大利文的副本。" },
          { time: "00:34", en: "[Para 2] However, the letter did not arrive as planned. Weymouth, with 35 men aboard, set off from Ratcliffe on 2nd May 1602. The westward crossing of the Atlantic was uneventful, but the waters beyond proved far more challenging.", zh: "【第2段】然而，這封信並未如期送達。韋茅斯率領 35 名船員，於 1602 年 5 月 2 日從拉特克利夫出發。橫渡大西洋一路平順，但之後的水域卻遠比預期險峻。" },
          { time: "00:50", en: "Heavy fog and sheets of ice near southern Greenland blocked their path, but Weymouth pushed further into the narrow channel between Baffin Island and the Ungava Peninsula, convinced that it might open westward into the Pacific. He led the expedition deeper into the channel, but had to turn back before reaching its far end.", zh: "南格陵蘭附近的濃霧與冰層封堵了去路，但韋茅斯仍繼續深入巴芬島（Baffin Island）與溫加瓦半島（Ungava Peninsula）之間的狹窄海峽，深信這條水道或許能向西通往太平洋。他率隊繼續推進，卻在抵達海峽盡頭前不得不折返。", evId: "ev-40" },
          { time: "01:12", en: "Ultimately, it was ill health that brought the exploration to a halt. On 26th July, with his crew increasingly unwell from the deprivations of the journey, Weymouth called off the voyage and headed for home, arriving back in Dartmouth on 5th September.", zh: "最終，是船員的健康問題迫使探險終止。7 月 26 日，隨著船員因旅途艱困而日益病重，韋茅斯宣布取消航行、啟程返鄉，於 9 月 5 日抵達達特茅斯。", evId: "ev-39" },
          { time: "01:29", en: "[Para 3] Interestingly, had Weymouth made landfall in China, he might not have been able to deliver the letter to Emperor Wanli. From around 1582, Emperor Wanli had grown estranged from his role. Somehow he felt he no longer belonged on the throne, becoming reluctant to engage in state affairs. The resulting internal power struggles weakened the Empire, which was eventually overthrown by the Manchu people from the north in 1644.", zh: "【第3段】有趣的是，即使韋茅斯真的登陸中國，他也未必能將信件送到萬曆皇帝手中。大約自 1582 年起，萬曆皇帝便逐漸與自己的角色疏離，不知為何覺得自己不再屬於這個皇位，愈來愈不願意處理國政。由此引發的內部權力鬥爭削弱了帝國實力，帝國最終於 1644 年被北方的滿族人推翻。", evId: "ev-41" },
          { time: "01:58", en: "[Para 4] The letter itself, however, managed to survive. It was later found lining a bran bin on a Lancashire farm. How the letter ended up there has puzzled many. It eventually became the property of the Crosse family, who later passed it to the Lancashire County Record Office. Then in 1984, a copy was finally delivered to China, completing the voyage Her Majesty had intended nearly four centuries earlier.", zh: "【第4段】然而，這封信本身卻奇蹟般地留存了下來。它後來被發現夾在蘭開夏郡一座農場的麩皮儲存桶內作為襯墊。這封信究竟如何流落至此，至今仍是謎。它最終成為克羅斯家族的財產，後由該家族轉交蘭開夏郡檔案室。1984 年，一份副本終於送達中國，完成了女王陛下近四個世紀前就意圖成就的旅程。", evId: "ev-42" }
        ],
        sentenceAnalysis: [
          {

            sentence: "Interestingly, [had Weymouth made landfall in China], he might not have been able to deliver the letter to Emperor Wanli.",
            breakdown: "【假設語氣條件句省略 if 倒裝】had Weymouth made landfall... (原為 If Weymouth had made landfall in China，與過去事實相反用過去完成式) ＋ 【主句】he might not have been able to deliver... (助動詞過去式 + have + p.p.，表示當時也未必能把信交到萬曆皇帝手中)。"

      "reading_43_46": {
        title: "第五大題：閱讀測驗（第 43–46 題題組）— 非洲「生命之樹」猴麵包樹（Baobab）與夜間授粉者的共生演化",
        type: "生態與演化生物學",
        bilingual: true,
        audioSentences: [
          { time: "00:00", en: "[Para 1] In Disney's The Lion King, the wise mandrill Rafiki makes his home in a massive, ancient tree. In reality, this is the baobab, an African icon often called the \"Tree of Life,\" for it supports entire ecosystems with its thick, water-storing trunk. Yet, the survival of the baobab itself depends on the partnerships its flowers forge with creatures of the night: bats and moths.", zh: "【第1段】在迪士尼的《獅子王》中，聰明的山魈拉飛奇（Rafiki）在一棵巨大、古老的樹上安家。在現實中，這棵樹就是猴麵包樹（baobab），它是常被稱為「生命之樹」的非洲象徵，因為它粗壯、能儲水的樹幹支撐著整個生態系統。然而，猴麵包樹自身的生存，卻仰賴於其花朵與夜間生物——蝙蝠和飛蛾——所建立的夥伴關係。" },
          { time: "00:26", en: "[Para 2] Across Africa, the baobab blooms only once a year, and its blossoms open at dusk and fade by dawn. Each night, just a few unfold while the rest wait for their turn. The white blossoms all hang down from the branches like lanterns, guiding their nocturnal pollinators to visit.", zh: "【第2段】在全非洲，猴麵包樹每年只開花一次，而且它的花朵在黃昏時綻放，在黎明前凋謝。每天晚上，只有幾朵花會綻放，其餘的則等待輪到自己的時刻。這些白色的花朵全都從樹枝上像燈籠一樣垂掛下來，引導著夜間的授粉者前來造訪。", evId: "ev-45" },
          { time: "00:46", en: "[Para 3] To attract specific visitors, baobabs in different regions have developed distinct flowers. In West Africa, the flowers emit a sulfur-like scent to draw the key pollinator: the large straw-colored fruit bat. The flowers here are big, with petals folding back, long stalks, and deep pools of nectar, perfectly suited for the bat to feed while hanging upside down.", zh: "【第3段】為了吸引特定的訪客，不同地區的猴麵包樹已經演化出了截然不同的花朵。在西非，花朵會散發出一種像硫磺一樣的氣味，以吸引關鍵的授粉者：大型的黃毛果蝠。這裡的花朵很大，花瓣向後翻摺、花梗很長，且含有深層的蜜池，非常適合蝙蝠倒掛著進食。", evId: "ev-43" },
          { time: "01:12", en: "In East Africa, the baobab blossoms are sturdier and more compact, with shorter stalks and less nectar. They have the same irresistible smell that caters to the smaller Egyptian fruit bat, which feeds by grasping the flowers rather than hanging upside down. Further south, the bats vanish entirely and moths take over. A sweet fragrance replaces sulfur to appeal to moths, while the flowers shrink, petals curve back only slightly, and nectar reduces to mere drops.", zh: "在東非，猴麵包樹的花朵比較堅韌且密實，具有較短的花梗以及較少的花蜜。它們散發出一樣讓蝙蝠難以抗拒的氣味，迎合較小型的埃及果蝠，這種蝙蝠會抓住花朵取食，而不是倒掛著進食。再往南走，蝙蝠完全消失了，由飛蛾接管。一種甜美的香氣取代了硫磺味以吸引飛蛾，同時花朵縮小，花瓣僅輕微向後彎曲，花蜜也減少到僅剩幾滴。", evId: "ev-44" },
          { time: "01:44", en: "[Para 4] Clearly, each baobab has locked its future to a single group of partners. Yet these alliances are surprisingly fragile. After all, it takes thousands of years for the baobab to shape its floral traits. Since birds, bees, and beetles do not pollinate baobab flowers, if climate change or habitat loss causes these bats and moths to disappear, the baobab's reproduction would halt entirely. With no new trees growing, the survival of the species would be threatened. Therefore, protecting the baobab isn't just about saving the \"Tree of Life\"; it's about safeguarding the silent winged creatures of the night — the true Rafikis of the \"Circle of Life.\"", zh: "【第4段】顯然，每種猴麵包樹都將自己的未來與單一的一組夥伴綁定在一起。然而，這些聯盟出乎意料地脆弱。畢竟，猴麵包樹需要花費數千年的時間才能形塑出其花卉特徵。由於鳥類、蜜蜂和甲蟲不會為猴麵包樹的花朵授粉，如果氣候變遷或棲地喪失導致這些蝙蝠和飛蛾消失，猴麵包樹的繁殖將會完全停滯。在沒有新樹生長的情況下，該物種的生存將受到威脅。因此，保護猴麵包樹不僅僅是為了拯救「生命之樹」；更是為了保護那些在夜間默默飛行的有翅生物——它們才是「生命之環」中真正的拉飛奇。", evId: "ev-46" }
        ],
        sentenceAnalysis: [

        audioSentences: [
          { time: "00:00", en: "[Intro] The exhibition Rapa Nui: Echoes of the Moai explores the heritage of the Rapa Nui, a civilization developed on one of the most isolated islands on Earth. The Moai, their iconic stone statues, are only part of their story. The six galleries ahead take you on a journey into their enduring legacy.", zh: "【展覽前言】「拉帕努伊：摩艾的迴響」展覽，深入探索了拉帕努伊人的文化遺產，這是在地球上最孤立（isolated）的島嶼之一所發展出的文明。他們標誌性的石像——摩艾，僅僅是他們故事的一部分。前方的六個展廳將帶您踏上一場旅程，走進他們歷久彌新的傳奇。", evId: "ev-47" },
          { time: "00:22", en: "[Gallery A. The Navel of the World] The Rapa Nui called their home Te Pito o Te Henua, \"the Navel of the World,\" as it was the very center of their universe. Guided only by instinct, the first Polynesians crossed the vast Pacific and prospered with limited resources. Step closer to a model of a va'a canoe and ancient fishing tools, and discover how they made the island their home.", zh: "【A展廳：世界的肚臍】拉帕努伊人稱他們的家園為「特皮托奧特赫努亞」，意即「世界的肚臍」，因為那是他們宇宙的絕對中心。第一批玻里尼西亞人僅憑藉著直覺，橫渡了廣闊的太平洋，並在有限的資源下繁衍生息（prospered）。走近看一看獨木舟（va'a）的模型與古代捕魚工具，探索他們是如何在這座島嶼上建立家園。" },
          { time: "00:46", en: "[Gallery B. The Moai Workshop] At the foot of the Rano Raraku volcano, hundreds of Moai still rest unfinished in the earth. How did a stone-age society carve gigantic statues without metal? The quarry landscape, unfinished figures, and stone tools known as toki reveal how a people at the height of their prosperity transformed volcanic rock into monumental works.", zh: "【B展廳：摩艾工作坊】在拉諾拉拉庫火山山腳下，仍有數百座未完工的摩艾石像靜靜躺在泥土中。一個石器時代的社會，在沒有金屬的情況下，是如何雕刻出巨大石像的？採石場的景觀、未完工的石像，以及被稱為「toki」的石製工具，揭示了處於繁榮鼎盛時期（height of their prosperity）的人們，是如何將火山岩轉化為不朽的巨作。", evId: "ev-48" },
          { time: "01:12", en: "[Gallery C. Guardians of Rapa Nui] In front of you stands a full-scale Moai replica set against an ocean backdrop. Like the originals, it faces inland, watching over the living. The Rapa Nui believed that each Moai carried mana — a sacred spiritual force that protected those before it. But how did an 80-ton giant travel across the island? Look closer and discover how the Moai \"walked.\"", zh: "【C展廳：拉帕努伊的守護者】矗立在您面前的是一座等身比例的摩艾複製品，背景是一片汪洋。就像那些原版石像一樣，它面朝內陸，守望著生者。拉帕努伊人相信每座摩艾都承載著「瑪那（mana）」——一種保護其面前子民的神聖精神力量。但是，一個重達 80 噸的龐然大物究竟是如何在島上移動的？靠近端詳，探索摩艾是如何「行走」的。", evId: "ev-49-c" },
          { time: "01:38", en: "[Gallery D. Between Two Worlds] What connects the world of the living and the dead? Meet the Moai Kavakava, carved wooden figures representing deceased ancestors. They were often hung in homes as protection against evil. Alongside them are the Rongorongo tablets, which preserved sacred chants sung to connect with ancestors. To this day, the script remains one of the world's undeciphered writings.", zh: "【D展廳：兩個世界之間】是什麼連結了生者與死者的世界？來認識「摩艾卡瓦卡瓦」吧，這些是代表逝去祖先的木雕人像。它們經常被掛在屋內，用以驅邪避凶。與它們並列的是「朗格朗格（Rongorongo）板」，上面保存了為了與祖先連結而吟唱的神聖讚歌。時至今日，這種文字仍是世界上未被破解的書寫系統之一。", evId: "ev-49-d" },
          { time: "02:04", en: "[Gallery E. The Birdman Cult] After Moai-based beliefs declined in the 16th century, a new religious order emerged to ease tribal conflict. Step into an interactive simulation of the Birdman ritual, where you become a warrior, racing against rivals to retrieve the first sooty tern egg. The winner will be recognized as the divinely chosen leader. Will you be the one?", zh: "【E展廳：鳥人崇拜】在 16 世紀以摩艾為中心的信仰衰落後，一個新的宗教秩序興起，以緩解部落衝突。走進鳥人儀式的互動模擬，在這裡您將化身為一名戰士，與對手相互競爭，爭奪並取回第一顆烏燕鷗的蛋。贏家將被公認為天選的領袖。您會是那個人嗎？", evId: "ev-49-e" },

    // ==========================================
    // 7. 互動邏輯：作答、切換模式、導覽列、字典與語音
    // ==========================================
    function switchPassageIfNeeded(passageKey) {
      if (passageKey && passageKey !== activePassageKey) {
        renderPassage(passageKey);
      }
    }

    function answerQuestion(qId, optKey, passageKey) {
      if (currentMode === 'exam' && examSubmitted) return;
      userState.answers[qId] = optKey;
      if (currentMode === 'practice') {
        userState.revealed[qId] = true;
        // 若答錯自動加入錯題本收藏
        const q = QUESTIONS.find(x => x.id === qId);
        if (q && optKey !== q.ans && !userState.bookmarks.includes(qId)) {
          userState.bookmarks.push(qId);
        }
      }
      saveState();
      switchPassageIfNeeded(passageKey);
      renderQuestions();
    }

    function submitTextAnswer(qId, passageKey) {
      const input = document.getElementById(`input-q-${qId}`);
      if (!input) return;
      const val = input.value.trim();
      if (!val) return;
      userState.answers[qId] = val;
      if (currentMode === 'practice') {
        userState.revealed[qId] = true;
      }
      saveState();
      switchPassageIfNeeded(passageKey);
      renderQuestions();
    }

    function toggleMultiOption(qId, optKey, passageKey) {
      let cur = userState.answers[qId] ? userState.answers[qId].split('') : [];
      if (cur.includes(optKey)) {
        cur = cur.filter(k => k !== optKey);
      } else {
        cur.push(optKey);
      }
      userState.answers[qId] = cur.sort().join('');
      if (currentMode === 'practice' && cur.length >= 3) {
        userState.revealed[qId] = true;
      }
      saveState();
      switchPassageIfNeeded(passageKey);
      renderQuestions();
    }

    function toggleExplanation(qId, passageKey) {
      userState.revealed[qId] = !userState.revealed[qId];
      saveState();
      switchPassageIfNeeded(passageKey);
      renderQuestions();
    }

    function toggleBookmark(qId) {
      const idx = userState.bookmarks.indexOf(qId);
      if (idx > -1) {
        userState.bookmarks.splice(idx, 1);
      } else {
        userState.bookmarks.push(qId);
      }
      saveState();
      renderQuestions();
    }

    function saveNote(qId, val) {
      userState.notes[qId] = val;
      saveState();
    }

    function setMode(mode) {
      currentMode = mode;
      examSubmitted = false;
      ['practice', 'exam', 'review'].forEach(m => {
        const btn = document.getElementById(`mode-${m}`);
        if (m === mode) {
          btn.className = "px-3 py-1.5 rounded-md font-medium transition bg-indigo-600 text-white";
        } else {
          btn.className = "px-3 py-1.5 rounded-md font-medium transition text-slate-300 hover:text-white";
        }
      });
      const submitBtn = document.getElementById('submit-exam-btn');
      if (mode === 'exam') {
        submitBtn.classList.remove('hidden');
      } else {
        submitBtn.classList.add('hidden');
      }
      renderQuestions();
      renderNavGrid();
    }

    function submitExam() {
      examSubmitted = true;
      openModal('analyticsModal');
      renderQuestions();
      renderNavGrid();
    }

    function selectSection(sec) {
      currentSection = sec;
      document.querySelectorAll('.sec-tab').forEach(btn => {
        if (btn.dataset.sec === sec) {
          btn.className = "sec-tab px-3 py-1 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/40 font-medium whitespace-nowrap";
        } else {
          btn.className = "sec-tab px-3 py-1 rounded hover:bg-slate-700 text-slate-300 whitespace-nowrap";
        }
      });
      renderQuestions();
    }

    function applyFilters() {
      renderQuestions();
    }

    // 渲染左側 1-50 題號導覽列
    function renderNavGrid() {
      const container = document.getElementById('nav-grid-container');
      const groups = [
        { label: "一、詞彙題 (1-10)", range: [1, 10] },
        { label: "二、綜合測驗 (11-20)", range: [11, 20] },
        { label: "三、文意選填 (21-30)", range: [21, 30] },
        { label: "四、篇章結構 (31-34)", range: [31, 34] },
        { label: "五、閱讀測驗 (35-46)", range: [35, 46] },
        { label: "第貳部分、混合題 (47-50)", range: [47, 50] }
      ];

      container.innerHTML = groups.map(g => {
        let btns = '';
        for (let i = g.range[0]; i <= g.range[1]; i++) {
          const q = QUESTIONS.find(x => x.id === i);
          const ans = userState.answers[i];
          const bookmarked = userState.bookmarks.includes(i);
          let colorClass = 'bg-slate-100 text-slate-700 hover:bg-indigo-100';

          if (ans) {
            if (currentMode === 'exam' && !examSubmitted) {
              colorClass = 'bg-indigo-600 text-white';
            } else {
              const correct = q.type === 'text'
                ? ans.trim().toLowerCase() === q.ans.toLowerCase()
                : ans === q.ans;
              colorClass = correct ? 'bg-emerald-500 text-white' : 'bg-rose-500 text-white';
            }
          }
          const ringClass = bookmarked ? 'ring-2 ring-amber-400 ring-offset-1' : '';

          btns += `
            <button onclick="jumpToQuestion(${i})" class="h-8 rounded-lg font-bold text-xs transition ${colorClass} ${ringClass}">
              ${i}
            </button>
          `;
        }
        return `
          <div>
            <div class="text-[11px] font-semibold text-slate-500 mb-1.5">${g.label}</div>
            <div class="grid grid-cols-5 gap-1.5">${btns}</div>
          </div>
        `;
      }).join('');
    }

    function jumpToQuestion(qId) {
      const q = QUESTIONS.find(x => x.id === qId);
      if (!q) return;
      if (currentSection !== 'all' && currentSection !== q.sec) {
        selectSection('all');
      }
      renderPassage(q.passageKey, q.evidenceId || null);
      setTimeout(() => {
        const card = document.getElementById(`question-card-${qId}`);
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 60);
    }

    function toggleSidebar() {
      const sb = document.getElementById('quiz-nav-sidebar');
      const openBtn = document.getElementById('sidebar-open-btn');
      if (sb.classList.contains('hidden')) {
        sb.classList.remove('hidden');
        openBtn.classList.add('hidden');
      } else {
        sb.classList.add('hidden');
        openBtn.classList.remove('hidden');
      }
    }

    // 點擊查單字與語音合成 (Web Speech API)
    function lookupWord(event, rawWord) {
      event.stopPropagation();
      const clean = rawWord.toLowerCase().replace(/[^a-z-]/g, '');
      const pop = document.getElementById('dict-popover');
      
      // 搜尋內建詞庫或字根比對
      let entry = DICT_DB[clean] || DICT_DB[clean.replace(/s$|ed$|ing$/, '')];
      
      // 若不在核心大詞庫，從所有題目的 vocab 中搜尋
      if (!entry) {
        for (const q of QUESTIONS) {
          if (q.vocab) {
            const found = q.vocab.find(v => v.word.toLowerCase() === clean || v.word.toLowerCase().startsWith(clean));
            if (found) {
              entry = { kk: found.kk, pos: found.pos, def: found.zh, extra: found.collocation };
              break;
            }
          }
        }
      }

      document.getElementById('dict-word').innerText = rawWord;
      if (entry) {
        document.getElementById('dict-pos').innerText = entry.pos;
        document.getElementById('dict-kk').innerText = entry.kk;
        document.getElementById('dict-def').innerText = entry.def;
        document.getElementById('dict-extra').innerText = entry.extra;
      } else {
        document.getElementById('dict-pos').innerText = 'Word';
        document.getElementById('dict-kk').innerText = '點擊喇叭圖示聽取發音';
        document.getElementById('dict-def').innerText = '高中學測核心實詞，可結合段落雙語中譯對照理解上下文語意。';
        document.getElementById('dict-extra').innerText = '支援即時英語語音合成朗讀';
      }

      const x = Math.min(event.clientX, window.innerWidth - 300);
      const y = Math.min(event.clientY + 14, window.innerHeight - 190);
      pop.style.left = `${Math.max(12, x)}px`;
      pop.style.top = `${Math.max(12, y)}px`;
      pop.classList.remove('hidden');
      speakWord(rawWord);
    }

    function closeDict() {
      document.getElementById('dict-popover').classList.add('hidden');
    }

    document.addEventListener('click', (e) => {
      const pop = document.getElementById('dict-popover');
      if (!pop.contains(e.target) && !e.target.classList.contains('word-token')) {
        closeDict();
      }
    });

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.92;
      window.speechSynthesis.speak(u);
    }

    function speakSentence(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    }

    // 螢光筆劃重點功能 (Highlighting)
    function toggleHighlighter() {
      highlighterActive = !highlighterActive;
      const btn = document.getElementById('btn-highlighter');
      if (highlighterActive) {
        btn.className = "px-2.5 py-1.5 rounded-lg bg-emerald-600 text-white border border-emerald-500 flex items-center gap-1.5 transition";
        btn.innerHTML = `<i class="fa-solid fa-highlighter"></i><span class="hidden md:inline">螢光筆: 開啟中</span>`;
      } else {
        btn.className = "px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 flex items-center gap-1.5 transition";
        btn.innerHTML = `<i class="fa-solid fa-highlighter text-emerald-400"></i><span class="hidden md:inline">螢光筆: 關閉</span>`;
      }
    }

    document.addEventListener('mouseup', () => {
      if (!highlighterActive) return;
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed || sel.toString().trim().length < 2) return;
      try {
        const range = sel.getRangeAt(0);
        const mark = document.createElement('mark');
        mark.className = 'user-mark';
        mark.title = '點擊可取消螢光筆標記';
        mark.onclick = function(e) {
          e.stopPropagation();
          const parent = this.parentNode;
          while (this.firstChild) parent.insertBefore(this.firstChild, this);
          parent.removeChild(this);
        };
        range.surroundContents(mark);
        sel.removeAllRanges();
      } catch (err) {
        // 跨節點選取時忽略
      }
    });

    // ==========================================
    // 8. 錯題本、學習統計儀表板與友善列印
    // ==========================================
    function openModal(id) {
      if (id === 'bookmarksModal') renderBookmarksModal();
      if (id === 'analyticsModal') renderAnalyticsModal();
      document.getElementById(id).classList.remove('hidden');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function renderBookmarksModal() {
      const container = document.getElementById('bookmarks-list');
      if (userState.bookmarks.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-slate-500">
            <i class="fa-regular fa-bookmark text-4xl mb-3 text-slate-300"></i>
            <p>目前還沒有收藏或錯題紀錄。在題目右上角點擊「收藏」或刷題答錯時會自動歸入此處！</p>
          </div>
        `;
        return;
      }

      container.innerHTML = userState.bookmarks.sort((a,b) => a - b).map(qId => {
        const q = QUESTIONS.find(x => x.id === qId);
        return `
          <div class="p-4 rounded-xl border border-slate-200 bg-slate-50 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 rounded bg-slate-900 text-white text-xs font-bold">第 ${q.id} 題</span>
                <span class="text-xs font-semibold text-indigo-700">${q.tag}</span>
                <span class="text-xs text-emerald-700 font-bold">正答：${q.ans}</span>
              </div>
              <p class="text-sm text-slate-800 font-medium">${q.stem}</p>
              <p class="text-xs text-slate-500">${q.stemZh}</p>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
              <button onclick="closeModal('bookmarksModal'); jumpToQuestion(${q.id})" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-medium">前往複習</button>
              <button onclick="toggleBookmark(${q.id}); renderBookmarksModal()" class="px-2.5 py-1.5 rounded-lg border border-slate-300 text-slate-600 hover:bg-rose-50 hover:text-rose-600 text-xs">移除</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderAnalyticsModal() {
      const container = document.getElementById('analytics-content');
      const secStats = [
        { key: 'vocab', name: '一、詞彙題 (1-10)', total: 10, ptsPerQ: 1 },
        { key: 'cloze', name: '二、綜合測驗 (11-20)', total: 10, ptsPerQ: 1 },
        { key: 'fill', name: '三、文意選填 (21-30)', total: 10, ptsPerQ: 1 },
        { key: 'structure', name: '四、篇章結構 (31-34)', total: 4, ptsPerQ: 2 },
        { key: 'reading', name: '五、閱讀測驗 (35-46)', total: 12, ptsPerQ: 2 },
        { key: 'mixed', name: '第貳部分、混合題 (47-50)', total: 4, ptsPerQ: 2.5 }
      ];

      let totalAnswered = 0;
      let totalCorrect = 0;
      let totalScore = 0;

      const rowsHTML = secStats.map(s => {
        const qs = QUESTIONS.filter(q => q.sec === s.key);
        let ansCount = 0;
        let corCount = 0;
        qs.forEach(q => {
          const u = userState.answers[q.id];
          if (u) {
            ansCount++;
            totalAnswered++;
            const isC = q.type === 'text' ? u.trim().toLowerCase() === q.ans.toLowerCase() : u === q.ans;
            if (isC) {
              corCount++;
              totalCorrect++;
              totalScore += (q.id === 49 ? 4 : (q.id >= 47 ? 2 : s.ptsPerQ));
            }
          }
        });
        const rate = ansCount > 0 ? Math.round((corCount / qs.length) * 100) : 0;
        return `
          <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
            <div class="flex items-center justify-between text-sm font-bold text-slate-800 mb-1.5">
              <span>${s.name}</span>
              <span class="text-indigo-600">答對 ${corCount} / ${qs.length} 題 (${rate}%)</span>
            </div>
            <div class="w-full h-2.5 bg-slate-200 rounded-full overflow-hidden">
              <div class="h-full bg-indigo-600 transition-all" style="width: ${rate}%"></div>
            </div>
          </div>
        `;
      }).join('');

      const overallAccuracy = totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) : 0;

      container.innerHTML = `
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
          <div class="p-4 rounded-2xl bg-indigo-50 border border-indigo-200 text-center">
            <div class="text-xs font-bold text-indigo-600 uppercase">目前已作答題數</div>
            <div class="text-3xl font-extrabold text-indigo-950 mt-1">${totalAnswered} <span class="text-base font-normal text-slate-500">/ 50 題</span></div>
          </div>
          <div class="p-4 rounded-2xl bg-emerald-50 border border-emerald-200 text-center">
            <div class="text-xs font-bold text-emerald-600 uppercase">已作答正確率</div>
            <div class="text-3xl font-extrabold text-emerald-950 mt-1">${overallAccuracy}%</div>
          </div>
          <div class="p-4 rounded-2xl bg-amber-50 border border-amber-200 text-center">
            <div class="text-xs font-bold text-amber-700 uppercase">選擇＋混合題累計得分</div>
            <div class="text-3xl font-extrabold text-amber-950 mt-1">${totalScore} <span class="text-base font-normal text-slate-500">/ 72 分</span></div>
          </div>
        </div>
        <h4 class="font-bold text-sm text-slate-700 mb-3">各大題型得分率診斷分析：</h4>
        <div class="space-y-3 mb-6">${rowsHTML}</div>
        <div class="flex justify-end">
          <button onclick="resetAllProgress()" class="px-4 py-2 rounded-xl border border-rose-300 text-rose-600 hover:bg-rose-50 text-xs font-bold transition">
            <i class="fa-solid fa-rotate-left mr-1"></i>清空所有作答紀錄重新練習
          </button>
        </div>
      `;
    }

    function resetAllProgress() {
      userState.answers = {};
      userState.revealed = {};
      saveState();
      renderAnalyticsModal();
      renderQuestions();
    }

    function executePrint(type) {
      closeModal('printModal');
      if (type === 'blank') {
        setMode('exam');
      } else {
        setMode('review');
      }
      selectSection('all');
      setTimeout(() => {
        window.print();
      }, 300);
    }

    // 初始化啟動
    window.addEventListener('DOMContentLoaded', () => {
      updateBookmarkBadge();
      renderNavGrid();
      renderPassage('vocab');
      renderQuestions();
    });
  </script>
</body></html>
